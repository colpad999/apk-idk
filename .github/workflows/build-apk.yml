name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Restore the ignored Gradle wrapper without replacing Android config
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name apk_idk "$RUNNER_TEMP/android-wrapper"
          cp "$RUNNER_TEMP/android-wrapper/android/gradlew" android/gradlew
          cp "$RUNNER_TEMP/android-wrapper/android/gradlew.bat" android/gradlew.bat
          cp "$RUNNER_TEMP/android-wrapper/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format .

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: colpad-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
